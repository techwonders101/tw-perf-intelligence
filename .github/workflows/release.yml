name: Release

on:
  release:
    types: [published]

jobs:
  zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin zip
        run: bash build.sh

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: tw-performance.zip
